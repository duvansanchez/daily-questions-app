<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug: Vista Previa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .editor-toolbar {
            border: 1px solid #e9ecef;
            border-bottom: none;
            background-color: #f8f9fa;
            padding: 8px;
            border-radius: 8px 8px 0 0;
        }
        
        .editor-textarea {
            border-radius: 0 0 8px 8px !important;
            border-top: none !important;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            min-height: 200px;
        }
        
        .editor-preview {
            border: 1px solid #e9ecef;
            border-radius: 0 0 8px 8px;
            background-color: white;
            padding: 12px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .preview-content {
            font-size: 18px;
            line-height: 1.6;
        }
        
        .preview-content p {
            margin-bottom: 0.75rem;
            line-height: 1.6;
            font-size: 18px;
        }
        
        .preview-content strong {
            font-weight: bold;
            color: #2c3e50;
            font-size: 18px;
        }
        
        .preview-content em {
            font-style: italic;
            color: #34495e;
            font-size: 18px;
        }
        
        .preview-content .highlight-red {
            background-color: #f8d7da;
            padding: 2px 4px;
            border-radius: 3px;
            color: #721c24;
            font-size: 18px;
        }
        
        .preview-content .task-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 0.5rem;
            padding: 2px 0;
            font-size: 18px;
        }
        
        .editor-preview {
            border: 1px solid #e9ecef;
            border-radius: 0 0 8px 8px;
            background-color: white;
            padding: 12px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            resize: vertical;
            position: relative;
        }
        
        .editor-preview::after {
            content: "";
            position: absolute;
            bottom: 0;
            right: 0;
            width: 16px;
            height: 16px;
            background: linear-gradient(-45deg, transparent 0%, transparent 40%, #ccc 40%, #ccc 60%, transparent 60%);
            cursor: nw-resize;
            pointer-events: none;
        }
        
        .preview-content .task-checkbox {
            margin-right: 8px;
            margin-top: 2px;
        }
        
        .btn.active {
            background-color: #28a745;
            border-color: #28a745;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐛 Debug: Vista Previa del Editor</h1>
        
        <div class="card">
            <div class="card-body">
                <!-- Barra de herramientas -->
                <div class="editor-toolbar">
                    <div class="btn-group btn-group-sm">
                        <button type="button" class="btn btn-outline-secondary" id="btn-bold">
                            <i class="bi bi-type-bold"></i>
                        </button>
                        <button type="button" class="btn btn-outline-secondary" id="btn-italic">
                            <i class="bi bi-type-italic"></i>
                        </button>
                        <button type="button" class="btn btn-outline-info" id="btn-preview">
                            <i class="bi bi-eye"></i> Vista Previa
                        </button>
                    </div>
                </div>
                
                <!-- Editor -->
                <div class="editor-container">
                    <textarea class="form-control editor-textarea" id="focus-sub-notas-texto">**Texto en negrita**

*Texto en cursiva*

==red:Texto resaltado en rojo==

- [ ] Tarea pendiente
- [x] Tarea completada

- Lista normal
- Otro elemento</textarea>
                    
                    <!-- Vista previa -->
                    <div class="editor-preview" id="focus-sub-notas-preview" style="display: none;">
                        <div class="preview-content"></div>
                    </div>
                </div>
                
                <!-- Debug info -->
                <div class="mt-3">
                    <h5>🔍 Debug Info</h5>
                    <div id="debug-info" class="small text-muted"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let editorMode = 'edit';
        
        function updateDebugInfo(message) {
            const debugDiv = document.getElementById('debug-info');
            debugDiv.innerHTML += '<div>' + new Date().toLocaleTimeString() + ': ' + message + '</div>';
        }
        
        function togglePreview() {
            const textarea = document.getElementById('focus-sub-notas-texto');
            const previewDiv = document.getElementById('focus-sub-notas-preview');
            const previewBtn = document.getElementById('btn-preview');
            
            updateDebugInfo('Toggle preview - elementos: textarea=' + !!textarea + ', previewDiv=' + !!previewDiv + ', previewBtn=' + !!previewBtn + ', currentMode=' + editorMode);
            
            if (!textarea || !previewDiv || !previewBtn) {
                updateDebugInfo('ERROR: Elementos necesarios para preview no encontrados');
                return;
            }
            
            if (editorMode === 'edit') {
                updateDebugInfo('Cambiando a vista previa');
                editorMode = 'preview';
                textarea.style.display = 'none';
                previewDiv.style.display = 'block';
                previewBtn.classList.add('active');
                previewBtn.innerHTML = '<i class="bi bi-pencil"></i> Editar';
                previewBtn.title = 'Editar';
                
                renderizarPreview();
            } else {
                updateDebugInfo('Cambiando a edición');
                editorMode = 'edit';
                textarea.style.display = 'block';
                previewDiv.style.display = 'none';
                previewBtn.classList.remove('active');
                previewBtn.innerHTML = '<i class="bi bi-eye"></i> Vista Previa';
                previewBtn.title = 'Vista previa';
                textarea.focus();
            }
        }
        
        function renderizarPreview() {
            const textarea = document.getElementById('focus-sub-notas-texto');
            const previewContent = document.querySelector('#focus-sub-notas-preview .preview-content');
            
            updateDebugInfo('Renderizando preview - elementos: textarea=' + !!textarea + ', previewContent=' + !!previewContent);
            
            if (!textarea || !previewContent) {
                updateDebugInfo('ERROR: Elementos para renderizar no encontrados');
                return;
            }
            
            let content = textarea.value;
            updateDebugInfo('Contenido a renderizar: ' + content.substring(0, 50) + '...');
            
            let lines = content.split('\n');
            let processedLines = [];
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                if (line === '') {
                    processedLines.push('<br>');
                    continue;
                }
                
                // Procesar tareas completadas
                if (line.match(/^- \[x\] (.*)$/)) {
                    const taskText = line.replace(/^- \[x\] (.*)$/, '$1');
                    processedLines.push(`<div class="task-item"><input type="checkbox" class="task-checkbox" checked disabled> <span class="task-completed">${taskText}</span></div>`);
                    continue;
                }
                
                // Procesar tareas pendientes
                if (line.match(/^- \[ \] (.*)$/)) {
                    const taskText = line.replace(/^- \[ \] (.*)$/, '$1');
                    processedLines.push(`<div class="task-item"><input type="checkbox" class="task-checkbox" disabled> <span>${taskText}</span></div>`);
                    continue;
                }
                
                // Procesar listas con viñetas (que no sean tareas)
                if (line.match(/^- (.*)$/) && !line.match(/^- \[/)) {
                    const listText = line.replace(/^- (.*)$/, '$1');
                    processedLines.push(`<li>${listText}</li>`);
                    continue;
                }
                
                // Procesar texto normal con formato
                line = line
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/==(\w+):(.*?)==/g, '<span class="highlight-$1">$2</span>')
                    .replace(/==(.*?)==/g, '<span class="highlight-yellow">$1</span>');
                
                processedLines.push(`<p>${line}</p>`);
            }
            
            content = processedLines.join('');
            
            // Envolver elementos <li> consecutivos en <ul>
            content = content.replace(/(<li>.*?<\/li>)(\s*<li>.*?<\/li>)*/g, function(match) {
                return '<ul>' + match + '</ul>';
            });
            
            // Envolver elementos de tarea consecutivos en contenedor
            content = content.replace(/(<div class="task-item">.*?<\/div>)(\s*<div class="task-item">.*?<\/div>)*/g, function(match) {
                return '<div class="task-list">' + match + '</div>';
            });
            
            // Limpiar <br> innecesarios
            content = content
                .replace(/<\/div><br><div/g, '</div><div')
                .replace(/<\/ul><br><ul/g, '</ul><ul>')
                .replace(/<\/p><br><p/g, '</p><p>');
            
            updateDebugInfo('Contenido renderizado: ' + content.substring(0, 100) + '...');
            previewContent.innerHTML = content || '<em class="text-muted">No hay contenido para mostrar</em>';
        }
        
        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            updateDebugInfo('DOM cargado, inicializando...');
            
            const previewBtn = document.getElementById('btn-preview');
            if (previewBtn) {
                previewBtn.addEventListener('click', togglePreview);
                updateDebugInfo('Event listener añadido al botón de preview');
            } else {
                updateDebugInfo('ERROR: Botón de preview no encontrado');
            }
        });
    </script>
</body>
</html>
