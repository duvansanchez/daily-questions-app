<!DOCTYPE html>
<html>
<head>
    <title>Simple Prefix Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="http://localhost:5000/static/css/focus-subobjetivos.css">
</head>
<body>
    <div class="container mt-4">
        <h1>Simple Prefix Test</h1>
        <div id="test-results" class="mt-3"></div>
        
        <h3>Test Sub-objetivos:</h3>
        <div id="test-subobjetivos">
            <div class="focus-subobjetivo-titulo">feat: Nueva funcionalidad</div>
            <div class="focus-subobjetivo-titulo">fix: Corregir error</div>
            <div class="focus-subobjetivo-titulo">refactor: Limpiar código</div>
            <div class="focus-subobjetivo-titulo">docs: Actualizar documentación</div>
            <div class="focus-subobjetivo-titulo">style: Mejorar diseño</div>
            <div class="focus-subobjetivo-titulo">investigate: Analizar problema</div>
            <div class="focus-subobjetivo-titulo">config: Configurar servidor</div>
            <div class="focus-subobjetivo-titulo">Sin prefijo</div>
        </div>
    </div>
    
    <script>
        // Test without loading external script first
        document.addEventListener('DOMContentLoaded', function() {
            const results = document.getElementById('test-results');
            
            // Try to load the script dynamically
            const script = document.createElement('script');
            script.src = 'http://localhost:5000/static/js/focus-subobjetivos.js';
            script.onload = function() {
                setTimeout(() => {
                    let html = '<div class="alert alert-info"><h4>Script Loading Test:</h4>';
                    html += `<p>procesarTituloConPrefijos: ${typeof procesarTituloConPrefijos}</p>`;
                    html += `<p>aplicarPrefijosSubobjetivos: ${typeof aplicarPrefijosSubobjetivos}</p>`;
                    html += `<p>window.procesarTituloConPrefijos: ${typeof window.procesarTituloConPrefijos}</p>`;
                    html += `<p>window.aplicarPrefijosSubobjetivos: ${typeof window.aplicarPrefijosSubobjetivos}</p>`;
                    html += '</div>';
                    
                    // Test prefix processing if available
                    if (typeof aplicarPrefijosSubobjetivos === 'function') {
                        html += '<div class="alert alert-success">✅ Applying prefixes to test elements...</div>';
                        aplicarPrefijosSubobjetivos();
                    } else {
                        html += '<div class="alert alert-warning">⚠️ aplicarPrefijosSubobjetivos function not available</div>';
                    }
                    
                    results.innerHTML = html;
                }, 1000);
            };
            script.onerror = function() {
                results.innerHTML = '<div class="alert alert-danger">❌ Failed to load focus-subobjetivos.js</div>';
            };
            document.head.appendChild(script);
        });
    </script>
</body>
</html>
