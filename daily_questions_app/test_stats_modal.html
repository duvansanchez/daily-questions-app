<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Stats Modal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .calendario-dia {
            width: 40px;
            height: 60px;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .calendario-dia:hover {
            background-color: #f8f9fa;
            border-color: #007bff;
        }
        .calendario-dia-numero {
            font-weight: bold;
            font-size: 14px;
        }
        .calendario-dia-respuesta {
            font-size: 10px;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Test Stats Modal - Simulación Exacta</h2>
        <p>Esta página simula exactamente el comportamiento del calendario en stats.html</p>
        
        <div class="mb-3">
            <h5>Calendario de Prueba</h5>
            <div class="d-flex flex-wrap">
                <div class="calendario-dia" 
                     style="background-color: #e3f2fd; cursor: pointer;" 
                     title="1 noviembre 2024\nCreados: 2\nCompletados: 1\nHaz clic para ver detalles"
                     onclick="abrirDetalleDia('2024-11-01')">
                    <div class="calendario-dia-numero">1</div>
                    <div class="calendario-dia-respuesta" style="color:#3b82f6; font-weight: 500;">📝 2</div>
                    <div class="calendario-dia-respuesta" style="color:#22c55e; font-weight: 500;">✅ 1</div>
                </div>
                
                <div class="calendario-dia" 
                     style="background-color: #f3e5f5; cursor: pointer;" 
                     title="2 noviembre 2024\nCreados: 1\nCompletados: 3\nHaz clic para ver detalles"
                     onclick="abrirDetalleDia('2024-11-02')">
                    <div class="calendario-dia-numero">2</div>
                    <div class="calendario-dia-respuesta" style="color:#3b82f6; font-weight: 500;">📝 1</div>
                    <div class="calendario-dia-respuesta" style="color:#22c55e; font-weight: 500;">✅ 3</div>
                </div>
                
                <div class="calendario-dia" 
                     style="background-color: #e8f5e8; cursor: pointer;" 
                     title="3 noviembre 2024\nCreados: 0\nCompletados: 2\nHaz clic para ver detalles"
                     onclick="abrirDetalleDia('2024-11-03')">
                    <div class="calendario-dia-numero">3</div>
                    <div class="calendario-dia-respuesta" style="color:#3b82f6; font-weight: 500;">📝 0</div>
                    <div class="calendario-dia-respuesta" style="color:#22c55e; font-weight: 500;">✅ 2</div>
                </div>
            </div>
        </div>
        
        <div class="mb-3">
            <button class="btn btn-info" onclick="verificarFuncion()">
                🔍 Verificar Función
            </button>
            <button class="btn btn-warning" onclick="limpiarLog()">
                🧹 Limpiar Log
            </button>
        </div>
        
        <div id="debug-info" class="mt-4">
            <h5>Debug Log:</h5>
            <div id="debug-output" style="max-height: 300px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- Modal Detalle del Día - Copia exacta del de stats.html -->
    <div class="modal fade" id="modalDetalleDia" tabindex="-1" aria-labelledby="modalDetalleDiaLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalDetalleDiaLabel">
              <i class="bi bi-calendar-day me-2"></i>Detalle del día: 
              <span id="modalDetalleDiaFecha" class="text-primary"></span>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row mb-4">
              <div class="col-md-6">
                <div class="card bg-light">
                  <div class="card-body text-center">
                    <h3 class="text-primary mb-1" id="detalle-total-creados">0</h3>
                    <small class="text-muted">Objetivos Creados</small>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="card bg-light">
                  <div class="card-body text-center">
                    <h3 class="text-success mb-1" id="detalle-total-completados">0</h3>
                    <small class="text-muted">Objetivos Completados</small>
                  </div>
                </div>
              </div>
            </div>
            <ul class="nav nav-tabs" id="detalleTab" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="creados-tab" data-bs-toggle="tab" data-bs-target="#creados" type="button" role="tab">
                  <i class="bi bi-plus-circle me-1"></i>Objetivos Creados 
                  <span class="badge bg-primary ms-1" id="badge-creados">0</span>
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="completados-tab" data-bs-toggle="tab" data-bs-target="#completados" type="button" role="tab">
                  <i class="bi bi-check-circle me-1"></i>Objetivos Completados 
                  <span class="badge bg-success ms-1" id="badge-completados">0</span>
                </button>
              </li>
            </ul>
            <div class="tab-content mt-3" id="detalleTabContent">
              <div class="tab-pane fade show active" id="creados" role="tabpanel">
                <div id="lista-objetivos-creados"></div>
              </div>
              <div class="tab-pane fade" id="completados" role="tabpanel">
                <div id="lista-objetivos-completados"></div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function log(message) {
            const output = document.getElementById('debug-output');
            const timestamp = new Date().toLocaleTimeString();
            output.innerHTML += `<div class="alert alert-info py-2 mb-1"><small>[${timestamp}]</small> ${message}</div>`;
            output.scrollTop = output.scrollHeight;
        }

        function limpiarLog() {
            document.getElementById('debug-output').innerHTML = '';
        }

        // Modal detalle del día - Versión 2.0 - Fix función no definida
        console.log('🔧 Función abrirDetalleDia cargándose...');
        window.abrirDetalleDia = async function(fecha) {
            console.log('🗓️ abrirDetalleDia llamada con fecha:', fecha);
            log('🗓️ abrirDetalleDia llamada con fecha: ' + fecha);
            
            try {
                const modal = new bootstrap.Modal(document.getElementById('modalDetalleDia'));
                document.getElementById('modalDetalleDiaFecha').textContent = new Date(fecha + 'T00:00:00').toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                document.getElementById('lista-objetivos-creados').innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
                document.getElementById('lista-objetivos-completados').innerHTML = '<div class="text-center py-4"><div class="spinner-border text-success"></div></div>';
                modal.show();
                log('✅ Modal mostrado correctamente');
                
                // Simular datos para la prueba (sin llamada real a API)
                const data = {
                    resumen: {
                        total_creados: Math.floor(Math.random() * 5),
                        total_completados: Math.floor(Math.random() * 3)
                    },
                    objetivos_creados: [
                        { titulo: 'Objetivo de prueba 1', descripcion: 'Descripción del objetivo 1' },
                        { titulo: 'Objetivo de prueba 2', descripcion: 'Descripción del objetivo 2' }
                    ],
                    objetivos_completados: [
                        { titulo: 'Objetivo completado 1', descripcion: 'Descripción del objetivo completado' }
                    ]
                };
                
                log('📊 Datos simulados generados');
                
                document.getElementById('detalle-total-creados').textContent = data.resumen.total_creados;
                document.getElementById('detalle-total-completados').textContent = data.resumen.total_completados;
                document.getElementById('badge-creados').textContent = data.resumen.total_creados;
                document.getElementById('badge-completados').textContent = data.resumen.total_completados;
                
                // Renderizar objetivos creados
                let htmlCreados = '';
                data.objetivos_creados.forEach(obj => {
                    htmlCreados += `<div class="border rounded p-3 mb-3"><h6>${obj.titulo}</h6><p class="text-muted small">${obj.descripcion || ''}</p></div>`;
                });
                document.getElementById('lista-objetivos-creados').innerHTML = htmlCreados || '<div class="text-center text-muted py-4">No se crearon objetivos este día</div>';
                
                // Renderizar objetivos completados
                let htmlCompletados = '';
                data.objetivos_completados.forEach(obj => {
                    htmlCompletados += `<div class="border rounded p-3 mb-3 bg-light"><h6>${obj.titulo}</h6><p class="text-muted small">${obj.descripcion || ''}</p></div>`;
                });
                document.getElementById('lista-objetivos-completados').innerHTML = htmlCompletados || '<div class="text-center text-muted py-4">No se completaron objetivos este día</div>';
                
                log('✅ Datos cargados en el modal');
                
            } catch (error) {
                console.error('Error:', error);
                log('❌ Error: ' + error.message);
                document.getElementById('lista-objetivos-creados').innerHTML = '<div class="alert alert-danger">Error al cargar objetivos</div>';
                document.getElementById('lista-objetivos-completados').innerHTML = '<div class="alert alert-danger">Error al cargar objetivos</div>';
            }
        };

        // Debug: Confirmar que la función está disponible
        console.log('✅ Función abrirDetalleDia definida:', typeof window.abrirDetalleDia === 'function');

        function verificarFuncion() {
            log('🔍 === VERIFICACIÓN DE FUNCIÓN ===');
            log('Función abrirDetalleDia existe: ' + (typeof window.abrirDetalleDia === 'function'));
            log('Modal existe: ' + (document.getElementById('modalDetalleDia') !== null));
            log('Bootstrap Modal disponible: ' + (typeof bootstrap !== 'undefined' && typeof bootstrap.Modal === 'function'));
            log('Elementos del modal:');
            log('- modalDetalleDiaFecha: ' + (document.getElementById('modalDetalleDiaFecha') !== null));
            log('- detalle-total-creados: ' + (document.getElementById('detalle-total-creados') !== null));
            log('- detalle-total-completados: ' + (document.getElementById('detalle-total-completados') !== null));
            log('- lista-objetivos-creados: ' + (document.getElementById('lista-objetivos-creados') !== null));
            log('- lista-objetivos-completados: ' + (document.getElementById('lista-objetivos-completados') !== null));
        }

        // Verificar que todo esté cargado
        document.addEventListener('DOMContentLoaded', function() {
            log('✅ Página cargada correctamente');
            verificarFuncion();
        });
    </script>
</body>
</html>
