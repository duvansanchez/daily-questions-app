<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Calendario de Objetivos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container py-4">
        <h2>Prueba del Calendario de Objetivos</h2>
        
        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5>Calendario de Objetivos (Creados vs Completados)</h5>
                    <div class="d-flex gap-2">
                        <select class="form-select form-select-sm" id="obj-cal-mes" style="width:auto; min-width:140px;"></select>
                        <select class="form-select form-select-sm" id="obj-cal-anio" style="width:auto; min-width:100px;"></select>
                        <button class="btn btn-sm btn-outline-primary" id="obj-cal-actualizar">
                            <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-4 mb-3">
                    <div class="text-center">
                        <div class="h4 fw-bold text-primary mb-0" id="obj-total-creados">0</div>
                        <small class="text-muted">Creados en el mes</small>
                    </div>
                    <div class="text-center">
                        <div class="h4 fw-bold text-success mb-0" id="obj-total-completados">0</div>
                        <small class="text-muted">Completados en el mes</small>
                    </div>
                </div>

                <div id="objetivos-calendario" class="calendario-container">
                    <div class="text-center py-5 text-muted">
                        <i class="bi bi-calendar3" style="font-size: 3rem; opacity: 0.3;"></i>
                        <div class="mt-2">Selecciona un mes y año para ver el calendario</div>
                    </div>
                </div>

                <div class="calendario-leyenda d-flex justify-content-center gap-3 mt-3 flex-wrap">
                    <div class="d-flex align-items-center gap-2">
                        <span class="calendario-leyenda-item" style="background-color:#3b82f6;"></span>
                        <small class="text-muted">📝 Objetivos Creados</small>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="calendario-leyenda-item" style="background-color:#22c55e;"></span>
                        <small class="text-muted">✅ Objetivos Completados</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Log de debug -->
        <div class="card mt-4">
            <div class="card-header">
                <h6>Log de Debug</h6>
            </div>
            <div class="card-body">
                <pre id="debug-log" style="max-height: 300px; overflow-y: auto; font-size: 0.8rem;"></pre>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Función de logging para debug
        function debugLog(message) {
            const logElement = document.getElementById('debug-log');
            const timestamp = new Date().toLocaleTimeString();
            logElement.textContent += `[${timestamp}] ${message}\n`;
            logElement.scrollTop = logElement.scrollHeight;
            console.log(message);
        }

        // Constantes
        const MESES_NOMBRES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

        function poblarSelectsObjetivosCalendario() {
            debugLog('Poblando selectores de mes y año');
            const selMes = document.getElementById('obj-cal-mes');
            const selAnio = document.getElementById('obj-cal-anio');
            
            if (!selMes || !selAnio) {
                debugLog('ERROR: No se encontraron los selectores');
                return;
            }
            
            selMes.innerHTML = '';
            MESES_NOMBRES.forEach((n, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = n;
                selMes.appendChild(opt);
            });
            
            const ahora = new Date();
            const anioActual = ahora.getFullYear();
            selAnio.innerHTML = '';
            for (let a = anioActual - 3; a <= anioActual + 1; a++) {
                const opt = document.createElement('option');
                opt.value = a;
                opt.textContent = a;
                selAnio.appendChild(opt);
            }
            
            selMes.value = String(ahora.getMonth());
            selAnio.value = String(anioActual);
            
            debugLog(`Selectores poblados: mes=${ahora.getMonth()}, año=${anioActual}`);
        }

        async function cargarCalendarioObjetivos() {
            const selMes = document.getElementById('obj-cal-mes');
            const selAnio = document.getElementById('obj-cal-anio');
            
            if (!selMes || !selAnio) {
                debugLog('ERROR: No se encontraron los selectores de mes y año');
                return;
            }
            
            const mes = parseInt(selMes.value, 10);
            const anio = parseInt(selAnio.value, 10);
            
            debugLog(`Cargando calendario para mes ${mes} (0-11), año ${anio}`);
            
            // Mostrar indicador de carga
            const cont = document.getElementById('objetivos-calendario');
            if (cont) {
                cont.innerHTML = `
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                        <div class="mt-2 text-muted">Cargando calendario...</div>
                    </div>
                `;
            }
            
            try {
                const url = `/api/objetivos/calendario?mes=${mes}&anio=${anio}`;
                debugLog(`Haciendo petición a: ${url}`);
                
                const resp = await fetch(url);
                debugLog(`Respuesta del servidor: ${resp.status} ${resp.statusText}`);
                
                if (!resp.ok) {
                    throw new Error(`Error HTTP ${resp.status}: ${resp.statusText}`);
                }
                
                const json = await resp.json();
                debugLog(`Datos recibidos: ${JSON.stringify(json, null, 2)}`);
                
                if (json.status !== 'success') {
                    throw new Error(`Error de API: ${json.message || 'Error desconocido'}`);
                }
                
                renderObjetivosCalendario(json.data);
                
            } catch (e) {
                debugLog(`ERROR cargando calendario: ${e.message}`);
                
                // Mostrar error en el contenedor
                if (cont) {
                    cont.innerHTML = `
                        <div class="text-center py-4 text-danger">
                            <i class="bi bi-exclamation-triangle" style="font-size: 2rem;"></i>
                            <div class="mt-2">Error al cargar el calendario</div>
                            <div class="small text-muted">${e.message}</div>
                            <button class="btn btn-sm btn-outline-primary mt-2" onclick="cargarCalendarioObjetivos()">
                                <i class="bi bi-arrow-clockwise"></i> Reintentar
                            </button>
                        </div>
                    `;
                }
            }
        }

        function renderObjetivosCalendario(data) {
            const cont = document.getElementById('objetivos-calendario');
            if (!cont || !data) {
                debugLog('ERROR: No se encontró el contenedor del calendario o no hay datos');
                return;
            }
            
            debugLog(`Renderizando calendario con datos: ${JSON.stringify(data)}`);
            
            const { anio, mes, dias_en_mes, creados_por_dia = {}, completados_por_dia = {} } = data;
            
            // Encabezado de días de la semana
            const diasSemana = ['L','M','X','J','V','S','D'];
            const primerDia = new Date(anio, mes, 1);
            const offset = (primerDia.getDay() + 6) % 7; // convertir a semana empezando lunes

            let header = '<div class="calendario-header">' + diasSemana.map(d => `<div class="calendario-dia-semana">${d}</div>`).join('') + '</div>';
            let grid = '<div class="calendario-grid">';
            
            // Días vacíos al inicio del mes
            for (let i = 0; i < offset; i++) {
                grid += '<div class="calendario-dia sin-datos otro-mes"></div>';
            }
            
            // Días del mes
            for (let dia = 1; dia <= dias_en_mes; dia++) {
                const creados = creados_por_dia[String(dia)] || 0;
                const completados = completados_por_dia[String(dia)] || 0;
                
                // Determinar el color de fondo basado en la actividad
                let claseExtra = '';
                let colorFondo = '#f8f9fa';
                
                if (creados > 0 || completados > 0) {
                    claseExtra = 'con-actividad';
                    if (completados > creados) {
                        colorFondo = '#d4edda'; // Verde claro si hay más completados
                    } else if (creados > completados) {
                        colorFondo = '#cce5ff'; // Azul claro si hay más creados
                    } else {
                        colorFondo = '#fff3cd'; // Amarillo claro si están equilibrados
                    }
                }
                
                grid += `
                <div class="calendario-dia ${claseExtra}" 
                     style="background-color: ${colorFondo};" 
                     title="${dia} ${MESES_NOMBRES[mes]} ${anio}\nCreados: ${creados}\nCompletados: ${completados}">
                    <div class="calendario-dia-numero">${dia}</div>
                    <div class="calendario-dia-respuesta" style="color:#3b82f6; font-weight: 500;">📝 ${creados}</div>
                    <div class="calendario-dia-respuesta" style="color:#22c55e; font-weight: 500;">✅ ${completados}</div>
                </div>`;
            }
            grid += '</div>';
            
            cont.innerHTML = header + grid;

            // Totales
            const totalCreados = Object.values(creados_por_dia).reduce((a,b)=>a+Number(b),0);
            const totalCompletados = Object.values(completados_por_dia).reduce((a,b)=>a+Number(b),0);
            const elCreados = document.getElementById('obj-total-creados');
            const elCompletados = document.getElementById('obj-total-completados');
            
            if (elCreados) elCreados.textContent = totalCreados;
            if (elCompletados) elCompletados.textContent = totalCompletados;
            
            debugLog(`Calendario renderizado: ${totalCreados} creados, ${totalCompletados} completados`);
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            debugLog('DOM cargado, inicializando calendario');
            
            poblarSelectsObjetivosCalendario();
            
            // Eventos
            const btnAct = document.getElementById('obj-cal-actualizar');
            const selMes = document.getElementById('obj-cal-mes');
            const selAnio = document.getElementById('obj-cal-anio');
            
            if (btnAct) btnAct.addEventListener('click', cargarCalendarioObjetivos);
            if (selMes) selMes.addEventListener('change', cargarCalendarioObjetivos);
            if (selAnio) selAnio.addEventListener('change', cargarCalendarioObjetivos);
            
            // Carga inicial
            cargarCalendarioObjetivos();
        });
    </script>
</body>
</html>
