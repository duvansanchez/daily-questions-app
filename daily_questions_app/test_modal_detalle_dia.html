<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Modal Detalle del Día</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Test Modal Detalle del Día</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5>Prueba de Modal</h5>
                        <p>Haz clic en los botones para probar el modal de detalle del día:</p>
                        
                        <button class="btn btn-primary mb-2" onclick="abrirDetalleDia('2024-10-31')">
                            Ver detalle de hoy (2024-10-31)
                        </button>
                        
                        <button class="btn btn-secondary mb-2" onclick="abrirDetalleDia('2024-10-30')">
                            Ver detalle de ayer (2024-10-30)
                        </button>
                        
                        <button class="btn btn-info mb-2" onclick="abrirDetalleDia('2024-10-29')">
                            Ver detalle de anteayer (2024-10-29)
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5>Estado de la Función</h5>
                        <div id="estado-funcion">
                            <p class="text-muted">Verificando función...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detalle del Día -->
    <div class="modal fade" id="modalDetalleDia" tabindex="-1" aria-labelledby="modalDetalleDiaLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalDetalleDiaLabel">
              <i class="bi bi-calendar-day me-2"></i>Detalle del día: 
              <span id="modalDetalleDiaFecha" class="text-primary"></span>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <!-- Resumen del día -->
            <div class="row mb-4">
              <div class="col-md-6">
                <div class="card bg-light">
                  <div class="card-body text-center">
                    <h3 class="text-primary mb-1" id="detalle-total-creados">0</h3>
                    <small class="text-muted">Objetivos Creados</small>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="card bg-light">
                  <div class="card-body text-center">
                    <h3 class="text-success mb-1" id="detalle-total-completados">0</h3>
                    <small class="text-muted">Objetivos Completados</small>
                  </div>
                </div>
              </div>
            </div>

            <!-- Tabs para objetivos -->
            <ul class="nav nav-tabs" id="detalleTab" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="creados-tab" data-bs-toggle="tab" data-bs-target="#creados" type="button" role="tab">
                  <i class="bi bi-plus-circle me-1"></i>Objetivos Creados 
                  <span class="badge bg-primary ms-1" id="badge-creados">0</span>
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="completados-tab" data-bs-toggle="tab" data-bs-target="#completados" type="button" role="tab">
                  <i class="bi bi-check-circle me-1"></i>Objetivos Completados 
                  <span class="badge bg-success ms-1" id="badge-completados">0</span>
                </button>
              </li>
            </ul>

            <div class="tab-content mt-3" id="detalleTabContent">
              <!-- Tab Objetivos Creados -->
              <div class="tab-pane fade show active" id="creados" role="tabpanel">
                <div id="lista-objetivos-creados">
                  <!-- Se carga dinámicamente -->
                </div>
              </div>

              <!-- Tab Objetivos Completados -->
              <div class="tab-pane fade" id="completados" role="tabpanel">
                <div id="lista-objetivos-completados">
                  <!-- Se carga dinámicamente -->
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/main.js"></script>
    
    <script>
        // Verificar si la función está disponible
        document.addEventListener('DOMContentLoaded', function() {
            const estadoDiv = document.getElementById('estado-funcion');
            
            if (typeof window.abrirDetalleDia === 'function') {
                estadoDiv.innerHTML = `
                    <div class="alert alert-success">
                        <i class="bi bi-check-circle me-2"></i>
                        Función <code>abrirDetalleDia</code> cargada correctamente
                    </div>
                `;
            } else {
                estadoDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Error: Función <code>abrirDetalleDia</code> no encontrada
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
