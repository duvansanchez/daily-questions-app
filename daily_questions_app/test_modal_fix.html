<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Modal Fix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Test Modal de Detalle del Día</h2>
        <p>Prueba para verificar que el modal funciona correctamente después del fix.</p>
        
        <div class="mb-3">
            <button class="btn btn-primary" onclick="testModal()">
                Test Modal - Hoy
            </button>
        </div>
        
        <div class="mb-3">
            <button class="btn btn-secondary" onclick="testModalAyer()">
                Test Modal - Ayer
            </button>
        </div>
        
        <div id="debug-info" class="mt-4">
            <h5>Debug Info:</h5>
            <div id="debug-output"></div>
        </div>
    </div>

    <!-- Modal Detalle del Día -->
    <div class="modal fade" id="modalDetalleDia" tabindex="-1" aria-labelledby="modalDetalleDiaLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalDetalleDiaLabel">
              <i class="bi bi-calendar-day me-2"></i>Detalle del día: 
              <span id="modalDetalleDiaFecha" class="text-primary"></span>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row mb-4">
              <div class="col-md-6">
                <div class="card bg-light">
                  <div class="card-body text-center">
                    <h3 class="text-primary mb-1" id="detalle-total-creados">0</h3>
                    <small class="text-muted">Objetivos Creados</small>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="card bg-light">
                  <div class="card-body text-center">
                    <h3 class="text-success mb-1" id="detalle-total-completados">0</h3>
                    <small class="text-muted">Objetivos Completados</small>
                  </div>
                </div>
              </div>
            </div>
            <ul class="nav nav-tabs" id="detalleTab" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="creados-tab" data-bs-toggle="tab" data-bs-target="#creados" type="button" role="tab">
                  <i class="bi bi-plus-circle me-1"></i>Objetivos Creados 
                  <span class="badge bg-primary ms-1" id="badge-creados">0</span>
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="completados-tab" data-bs-toggle="tab" data-bs-target="#completados" type="button" role="tab">
                  <i class="bi bi-check-circle me-1"></i>Objetivos Completados 
                  <span class="badge bg-success ms-1" id="badge-completados">0</span>
                </button>
              </li>
            </ul>
            <div class="tab-content mt-3" id="detalleTabContent">
              <div class="tab-pane fade show active" id="creados" role="tabpanel">
                <div id="lista-objetivos-creados"></div>
              </div>
              <div class="tab-pane fade" id="completados" role="tabpanel">
                <div id="lista-objetivos-completados"></div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function log(message) {
            const output = document.getElementById('debug-output');
            output.innerHTML += '<div class="alert alert-info">' + message + '</div>';
        }

        window.abrirDetalleDia = async function(fecha) {
            log('🗓️ Abriendo detalle del día: ' + fecha);
            try {
                const modal = new bootstrap.Modal(document.getElementById('modalDetalleDia'));
                document.getElementById('modalDetalleDiaFecha').textContent = new Date(fecha + 'T00:00:00').toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                document.getElementById('lista-objetivos-creados').innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
                document.getElementById('lista-objetivos-completados').innerHTML = '<div class="text-center py-4"><div class="spinner-border text-success"></div></div>';
                modal.show();
                
                log('📡 Haciendo petición a API...');
                const response = await fetch(`/api/objetivos/dia/${fecha}`);
                const data = await response.json();
                
                log('✅ Datos recibidos: ' + JSON.stringify(data.resumen));
                
                document.getElementById('detalle-total-creados').textContent = data.resumen.total_creados;
                document.getElementById('detalle-total-completados').textContent = data.resumen.total_completados;
                document.getElementById('badge-creados').textContent = data.resumen.total_creados;
                document.getElementById('badge-completados').textContent = data.resumen.total_completados;
                
                // Renderizar objetivos creados
                let htmlCreados = '';
                data.objetivos_creados.forEach(obj => {
                    htmlCreados += `<div class="border rounded p-3 mb-3"><h6>${obj.titulo}</h6><p class="text-muted small">${obj.descripcion || ''}</p></div>`;
                });
                document.getElementById('lista-objetivos-creados').innerHTML = htmlCreados || '<div class="text-center text-muted py-4">No se crearon objetivos este día</div>';
                
                // Renderizar objetivos completados
                let htmlCompletados = '';
                data.objetivos_completados.forEach(obj => {
                    htmlCompletados += `<div class="border rounded p-3 mb-3 bg-light"><h6>${obj.titulo}</h6><p class="text-muted small">${obj.descripcion || ''}</p></div>`;
                });
                document.getElementById('lista-objetivos-completados').innerHTML = htmlCompletados || '<div class="text-center text-muted py-4">No se completaron objetivos este día</div>';
                
            } catch (error) {
                log('❌ Error: ' + error.message);
                document.getElementById('lista-objetivos-creados').innerHTML = '<div class="alert alert-danger">Error al cargar objetivos</div>';
                document.getElementById('lista-objetivos-completados').innerHTML = '<div class="alert alert-danger">Error al cargar objetivos</div>';
            }
        };

        function testModal() {
            const hoy = new Date().toISOString().split('T')[0];
            log('🧪 Probando modal para hoy: ' + hoy);
            abrirDetalleDia(hoy);
        }

        function testModalAyer() {
            const ayer = new Date();
            ayer.setDate(ayer.getDate() - 1);
            const fechaAyer = ayer.toISOString().split('T')[0];
            log('🧪 Probando modal para ayer: ' + fechaAyer);
            abrirDetalleDia(fechaAyer);
        }

        // Verificar que todo esté cargado
        document.addEventListener('DOMContentLoaded', function() {
            log('✅ Página cargada');
            log('✅ Función abrirDetalleDia definida: ' + (typeof window.abrirDetalleDia === 'function'));
            log('✅ Modal encontrado: ' + (document.getElementById('modalDetalleDia') !== null));
        });
    </script>
</body>
</html>
