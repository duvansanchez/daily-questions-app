<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Simple Modal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Test Simple Modal</h1>
        
        <div class="card">
            <div class="card-body">
                <h5>Prueba Directa</h5>
                
                <button class="btn btn-primary" onclick="abrirModalSimple('2024-10-31')">
                    Abrir Modal para 2024-10-31
                </button>
                
                <div id="debug-info" class="mt-3"></div>
            </div>
        </div>
    </div>

    <!-- Modal Simple -->
    <div class="modal fade" id="modalDetalleDia" tabindex="-1">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              <i class="bi bi-calendar-day me-2"></i>Detalle del día: 
              <span id="modalDetalleDiaFecha" class="text-primary"></span>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row mb-4">
              <div class="col-md-6">
                <div class="card bg-light">
                  <div class="card-body text-center">
                    <h3 class="text-primary mb-1" id="detalle-total-creados">0</h3>
                    <small class="text-muted">Objetivos Creados</small>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="card bg-light">
                  <div class="card-body text-center">
                    <h3 class="text-success mb-1" id="detalle-total-completados">0</h3>
                    <small class="text-muted">Objetivos Completados</small>
                  </div>
                </div>
              </div>
            </div>

            <ul class="nav nav-tabs" id="detalleTab" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="creados-tab" data-bs-toggle="tab" data-bs-target="#creados" type="button" role="tab">
                  <i class="bi bi-plus-circle me-1"></i>Objetivos Creados 
                  <span class="badge bg-primary ms-1" id="badge-creados">0</span>
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="completados-tab" data-bs-toggle="tab" data-bs-target="#completados" type="button" role="tab">
                  <i class="bi bi-check-circle me-1"></i>Objetivos Completados 
                  <span class="badge bg-success ms-1" id="badge-completados">0</span>
                </button>
              </li>
            </ul>

            <div class="tab-content mt-3">
              <div class="tab-pane fade show active" id="creados" role="tabpanel">
                <div id="lista-objetivos-creados">
                  <!-- Se carga dinámicamente -->
                </div>
              </div>
              <div class="tab-pane fade" id="completados" role="tabpanel">
                <div id="lista-objetivos-completados">
                  <!-- Se carga dinámicamente -->
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        function log(message) {
            const debug = document.getElementById('debug-info');
            debug.innerHTML += `<div class="alert alert-info small">${message}</div>`;
            console.log(message);
        }
        
        async function abrirModalSimple(fecha) {
            try {
                log(`🗓️ Iniciando modal para fecha: ${fecha}`);
                
                // Mostrar modal inmediatamente
                const modalElement = document.getElementById('modalDetalleDia');
                const modal = new bootstrap.Modal(modalElement);
                
                // Actualizar fecha en el título
                document.getElementById('modalDetalleDiaFecha').textContent = formatearFechaLegible(fecha);
                
                // Mostrar loading
                document.getElementById('lista-objetivos-creados').innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div><p class="mt-2">Cargando objetivos creados...</p></div>';
                document.getElementById('lista-objetivos-completados').innerHTML = '<div class="text-center py-4"><div class="spinner-border text-success" role="status"></div><p class="mt-2">Cargando objetivos completados...</p></div>';
                
                modal.show();
                log('✅ Modal mostrado');
                
                // Obtener datos de la API
                log(`📡 Llamando API: /api/objetivos/dia/${fecha}`);
                const response = await fetch(`/api/objetivos/dia/${fecha}`);
                
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                log(`📊 Datos recibidos: ${JSON.stringify(data.resumen)}`);
                
                if (data.status !== 'success') {
                    throw new Error(data.error || 'Error desconocido');
                }
                
                // Actualizar resumen
                document.getElementById('detalle-total-creados').textContent = data.resumen.total_creados;
                document.getElementById('detalle-total-completados').textContent = data.resumen.total_completados;
                document.getElementById('badge-creados').textContent = data.resumen.total_creados;
                document.getElementById('badge-completados').textContent = data.resumen.total_completados;
                
                // Renderizar objetivos
                renderizarObjetivosCreados(data.objetivos_creados);
                renderizarObjetivosCompletados(data.objetivos_completados);
                
                log('✅ Modal cargado completamente');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`);
                console.error('Error completo:', error);
                
                // Mostrar error en el modal
                document.getElementById('lista-objetivos-creados').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Error al cargar objetivos: ${error.message}
                    </div>
                `;
                document.getElementById('lista-objetivos-completados').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Error al cargar objetivos: ${error.message}
                    </div>
                `;
            }
        }
        
        function renderizarObjetivosCreados(objetivos) {
            const container = document.getElementById('lista-objetivos-creados');
            
            if (objetivos.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-muted py-4">
                        <i class="bi bi-plus-circle fs-1 mb-2 d-block"></i>
                        <p>No se crearon objetivos este día</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            objetivos.forEach(obj => {
                html += `
                    <div class="border rounded p-3 mb-3">
                        <h6 class="mb-1">📋 ${obj.titulo}</h6>
                        ${obj.descripcion ? `<p class="text-muted small mb-2">${obj.descripcion}</p>` : ''}
                        <div class="d-flex gap-3 small text-muted">
                            <span><i class="bi bi-clock me-1"></i>${obj.fecha_creacion}</span>
                            ${obj.prioridad ? `<span class="badge bg-warning">${obj.prioridad}</span>` : ''}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function renderizarObjetivosCompletados(objetivos) {
            const container = document.getElementById('lista-objetivos-completados');
            
            if (objetivos.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-muted py-4">
                        <i class="bi bi-check-circle fs-1 mb-2 d-block"></i>
                        <p>No se completaron objetivos este día</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            objetivos.forEach(obj => {
                html += `
                    <div class="border rounded p-3 mb-3 bg-light">
                        <h6 class="mb-1">✅ ${obj.titulo}</h6>
                        ${obj.descripcion ? `<p class="text-muted small mb-2">${obj.descripcion}</p>` : ''}
                        <div class="d-flex gap-3 small text-muted">
                            <span><i class="bi bi-check-circle me-1 text-success"></i>Completado: ${obj.fecha_completado || obj.hora_completado || 'N/A'}</span>
                            ${obj.prioridad ? `<span class="badge bg-success">${obj.prioridad}</span>` : ''}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function formatearFechaLegible(fecha) {
            const fechaObj = new Date(fecha + 'T00:00:00');
            const opciones = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            return fechaObj.toLocaleDateString('es-ES', opciones);
        }
    </script>
</body>
</html>
