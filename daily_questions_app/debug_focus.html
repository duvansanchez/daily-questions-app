<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Modo Focus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-4">
        <h2>🐛 Debug - Modo Focus</h2>
        
        <button class="btn btn-primary" onclick="testFocus()">
            Test Modo Focus
        </button>
        
        <div id="debug-output" class="mt-3"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simular datos de objetivos
        window.objetivos = [
            {
                id: 1,
                titulo: "Objetivo de prueba",
                descripcion: "Descripción de prueba",
                categoria: "diario",
                prioridad: "alta",
                parte_dia: "mañana",
                horas_estimadas: 2.5
            }
        ];

        function testFocus() {
            const output = document.getElementById('debug-output');
            
            // Test 1: Verificar variable objetivos
            output.innerHTML += '<p>✅ Variable objetivos: ' + (typeof objetivos !== 'undefined' ? 'OK' : 'ERROR') + '</p>';
            
            // Test 2: Verificar elementos del DOM
            const elementos = [
                'focus-titulo',
                'focus-descripcion', 
                'focus-categoria',
                'focus-prioridad',
                'focus-parte-dia',
                'focus-tiempo',
                'focus-subobjetivos-list',
                'focus-notas-texto',
                'modalFocusObjetivo'
            ];
            
            elementos.forEach(id => {
                const elemento = document.getElementById(id);
                output.innerHTML += '<p>' + (elemento ? '✅' : '❌') + ' Elemento ' + id + ': ' + (elemento ? 'OK' : 'NO ENCONTRADO') + '</p>';
            });
            
            // Test 3: Verificar Bootstrap
            output.innerHTML += '<p>✅ Bootstrap Modal: ' + (typeof bootstrap !== 'undefined' && bootstrap.Modal ? 'OK' : 'ERROR') + '</p>';
        }

        // Función showError simulada
        function showError(message) {
            alert('Error: ' + message);
        }

        // Función formatearHorasMinutos simulada
        function formatearHorasMinutos(horas) {
            const h = Math.floor(horas);
            const m = Math.round((horas - h) * 60);
            return h > 0 ? `${h}h ${m}min` : `${m}min`;
        }
    </script>
</body>
</html>
