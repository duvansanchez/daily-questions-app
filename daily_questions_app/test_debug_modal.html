<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Modal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Debug Modal de Detalle</h1>
        
        <div class="card">
            <div class="card-body">
                <h5>Pruebas de Funcionalidad</h5>
                
                <div class="mb-3">
                    <button class="btn btn-primary" onclick="testFunction()">
                        Test 1: Verificar función básica
                    </button>
                </div>
                
                <div class="mb-3">
                    <button class="btn btn-secondary" onclick="testModal()">
                        Test 2: Abrir modal manualmente
                    </button>
                </div>
                
                <div class="mb-3">
                    <button class="btn btn-success" onclick="testAbrirDetalleDia()">
                        Test 3: Llamar abrirDetalleDia
                    </button>
                </div>
                
                <div class="mb-3">
                    <button class="btn btn-info" onclick="testAPI()">
                        Test 4: Probar API directamente
                    </button>
                </div>
                
                <div id="debug-output" class="mt-3">
                    <!-- Salida de debug -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detalle del Día -->
    <div class="modal fade" id="modalDetalleDia" tabindex="-1" aria-labelledby="modalDetalleDiaLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalDetalleDiaLabel">
              <i class="bi bi-calendar-day me-2"></i>Detalle del día: 
              <span id="modalDetalleDiaFecha" class="text-primary"></span>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <!-- Resumen del día -->
            <div class="row mb-4">
              <div class="col-md-6">
                <div class="card bg-light">
                  <div class="card-body text-center">
                    <h3 class="text-primary mb-1" id="detalle-total-creados">0</h3>
                    <small class="text-muted">Objetivos Creados</small>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="card bg-light">
                  <div class="card-body text-center">
                    <h3 class="text-success mb-1" id="detalle-total-completados">0</h3>
                    <small class="text-muted">Objetivos Completados</small>
                  </div>
                </div>
              </div>
            </div>

            <!-- Tabs para objetivos -->
            <ul class="nav nav-tabs" id="detalleTab" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="creados-tab" data-bs-toggle="tab" data-bs-target="#creados" type="button" role="tab">
                  <i class="bi bi-plus-circle me-1"></i>Objetivos Creados 
                  <span class="badge bg-primary ms-1" id="badge-creados">0</span>
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="completados-tab" data-bs-toggle="tab" data-bs-target="#completados" type="button" role="tab">
                  <i class="bi bi-check-circle me-1"></i>Objetivos Completados 
                  <span class="badge bg-success ms-1" id="badge-completados">0</span>
                </button>
              </li>
            </ul>

            <div class="tab-content mt-3" id="detalleTabContent">
              <!-- Tab Objetivos Creados -->
              <div class="tab-pane fade show active" id="creados" role="tabpanel">
                <div id="lista-objetivos-creados">
                  <!-- Se carga dinámicamente -->
                </div>
              </div>

              <!-- Tab Objetivos Completados -->
              <div class="tab-pane fade" id="completados" role="tabpanel">
                <div id="lista-objetivos-completados">
                  <!-- Se carga dinámicamente -->
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/main.js"></script>
    
    <script>
        function log(message) {
            const output = document.getElementById('debug-output');
            output.innerHTML += `<div class="alert alert-info">${message}</div>`;
            console.log(message);
        }
        
        function testFunction() {
            log('Test 1: Verificando funciones básicas...');
            
            if (typeof bootstrap !== 'undefined') {
                log('✅ Bootstrap está cargado');
            } else {
                log('❌ Bootstrap NO está cargado');
            }
            
            if (typeof window.abrirDetalleDia === 'function') {
                log('✅ Función abrirDetalleDia está disponible');
            } else {
                log('❌ Función abrirDetalleDia NO está disponible');
            }
            
            const modal = document.getElementById('modalDetalleDia');
            if (modal) {
                log('✅ Modal HTML está presente');
            } else {
                log('❌ Modal HTML NO está presente');
            }
        }
        
        function testModal() {
            log('Test 2: Abriendo modal manualmente...');
            try {
                const modal = new bootstrap.Modal(document.getElementById('modalDetalleDia'));
                modal.show();
                log('✅ Modal abierto manualmente');
            } catch (error) {
                log('❌ Error abriendo modal: ' + error.message);
            }
        }
        
        function testAbrirDetalleDia() {
            log('Test 3: Llamando abrirDetalleDia...');
            try {
                if (typeof window.abrirDetalleDia === 'function') {
                    window.abrirDetalleDia('2024-10-31');
                    log('✅ Función abrirDetalleDia llamada');
                } else {
                    log('❌ Función abrirDetalleDia no existe');
                }
            } catch (error) {
                log('❌ Error en abrirDetalleDia: ' + error.message);
            }
        }
        
        async function testAPI() {
            log('Test 4: Probando API directamente...');
            try {
                const response = await fetch('/api/objetivos/dia/2024-10-31');
                log('📡 Respuesta de API: ' + response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    log('✅ Datos recibidos: ' + JSON.stringify(data, null, 2));
                } else {
                    log('❌ Error en API: ' + response.status);
                }
            } catch (error) {
                log('❌ Error de red: ' + error.message);
            }
        }
        
        // Auto-ejecutar test básico al cargar
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(testFunction, 1000);
        });
    </script>
</body>
</html>
